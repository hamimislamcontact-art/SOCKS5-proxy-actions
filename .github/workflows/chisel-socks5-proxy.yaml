name: Host Chisel SOCKS5 Proxy

on:
  workflow_dispatch:
    inputs:
      time-duration:
        description: Time to run chisel
        required: true
        default: 10m

jobs:
  socks5-proxy:
    runs-on: ubuntu-latest

    steps:
      - name: Download latest chisel
        working-directory: ${{ runner.temp }}
        run: |
          version=$(curl -s https://api.github.com/repos/jpillora/chisel/releases/latest | jq -r '.tag_name')
          mkdir chisel
          wget -O - https://github.com/jpillora/chisel/releases/download/$version/chisel_${version/v}_linux_amd64.gz | gzip -d > chisel/chisel
          chmod +x chisel/chisel

      - name: Install chisel
        uses: AnimMouse/tool-cache@v1
        with:
          folder_name: chisel

      - name: Download cloudflared
        run: |
          curl -L --output cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared

      - name: Start Cloudflare Tunnel
        run: |
          nohup ./cloudflared tunnel run \
            --token "${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}" \
            > cloudflared.log 2>&1 &

          sleep 5

          echo "=== Cloudflare Tunnel Log ==="
          cat cloudflared.log

      - name: Run chisel
        run: |
          timeout "${{ github.event.inputs.time-duration }}" \
            chisel server --socks5 || true

      - name: Show Cloudflare Tunnel logs
        if: always()
        run: |
          echo "=== Cloudflare Tunnel Log ==="
          cat cloudflared.log || true
